name: Release

# 打 tag 触发完整发版；手动触发只做构建验证，不创建 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build x86 Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 游戏是 32 位进程，注入器与 DLL 必须同为 x86。
      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # build.bat 在本机绕开 vcvars 是因为 reg.exe 被安全策略拦；
      # 这里工具链已由 vcvars 备好，用该变量跳过它自己的硬编码路径。
      - name: Build
        working-directory: ra3-copilot
        env:
          RA3_TOOLCHAIN_READY: "1"
        shell: cmd
        run: build.bat

      - name: Check artifacts
        shell: pwsh
        run: |
          $files = @(
            'ra3-copilot/build_out/Ra3Copilot.exe',
            'ra3-copilot/build_out/ra3copilot.dll',
            'ra3-copilot/injector.exe',
            'ra3-copilot/ra3diag.exe'
          )
          $bad = $false
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Error "缺少产物: $f"; $bad = $true; continue }
            $len = (Get-Item $f).Length
            if ($len -lt 10000) { Write-Error "产物异常偏小: $f ($len bytes)"; $bad = $true }
            Write-Host ("  {0}  {1:N0} bytes" -f $f, $len)
          }
          if ($bad) { exit 1 }

      - name: Check MCP server syntax
        shell: pwsh
        run: python -m py_compile ra3-copilot/mcp/ra3_mcp.py

      - name: Check version matches tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $rc = Get-Content ra3-copilot/res/launcher.rc -Raw
          $m = [regex]::Match($rc, 'FILEVERSION\s+(\d+),(\d+),(\d+)')
          if (-not $m.Success) { Write-Error "launcher.rc 里读不到 FILEVERSION"; exit 1 }
          $ver = "$($m.Groups[1].Value).$($m.Groups[2].Value).$($m.Groups[3].Value)"
          if ($ver -ne $tag) {
            Write-Warning "tag 是 $tag，但 launcher.rc 的 FILEVERSION 是 $ver —— exe 属性里的版本号会对不上"
          } else {
            Write-Host "版本一致: $ver"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item ra3-copilot/build_out/Ra3Copilot.exe stage/
          Copy-Item ra3-copilot/build_out/ra3copilot.dll stage/
          Copy-Item ra3-copilot/injector.exe stage/
          Copy-Item ra3-copilot/ra3diag.exe stage/
          @(
            'Ra3-Copilot —— 红色警戒 3 日冕 Mod 作战辅助系统',
            '',
            'Ra3Copilot.exe   双击运行，自动识别游戏进程；面板内「注入修改器」',
            'ra3copilot.dll   注入模块（热重载 / 开发用）',
            'injector.exe     命令行注入器（开发用）',
            'ra3diag.exe      排障诊断器：卡住时双击运行，把同目录生成的 txt 发回',
            '',
            '要求：ra3_1.12.game v1.12.3444.25830（32 位）。零售版与 Steam TUC 版均可，',
            '      启动器按 PE 头自动判定构建，也可在主界面手动指定。',
            '      hook 点硬编码于该版本，注入前做 AOB 字节级校验，不符拒绝挂载。',
            '接口：注入后常驻监听 127.0.0.1:17832；游戏内按呼出键（默认 F12）呼出面板。',
            '',
            '仅用于单机学习与研究。'
          ) -join "`r`n" | Set-Content -Path stage/RELEASE.txt -Encoding UTF8
          $zip = "Ra3Copilot-${{ github.ref_name }}-win-x86.zip"
          Compress-Archive -Path stage/* -DestinationPath $zip -Force
          # 单文件对外发布件也带版本号：下载下来能一眼分清是哪个版本
          $exe = "Ra3Copilot-${{ github.ref_name }}-win-x86.exe"
          Copy-Item -Path stage/Ra3Copilot.exe -Destination $exe -Force
          $sums = foreach ($f in @($zip, $exe)) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
          }
          $sums | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      # 更新说明取 CHANGELOG.md 里对应 tag 的那一节，避免每次发版都手改 yml。
      - name: Extract release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))\s*$") { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Warning "CHANGELOG.md 里没有 $tag 这一节，退回通用说明"
            "（本版未单独撰写更新说明，详见仓库 CHANGELOG.md）" | Set-Content RELEASE_NOTES.md -Encoding utf8
            exit 0
          }
          $out = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+v") { break }
            $out += $lines[$i]
          }
          $body = ($out -join "`n").Trim()
          $body = ($body -replace "(\r?\n-{3,}\s*)+$", "").Trim()   # 去掉小节末尾的分隔线，避免与尾注前的 --- 重复
          @(
            $body,
            '',
            '---',
            '',
            '**适配基线**：`ra3_1.12.game` v1.12.3444.25830（32 位，日冕 Mod），零售版与 Steam TUC 版均可，构建由启动器判定或手动指定。注入前执行 AOB 字节级校验，不符拒绝挂载。',
            '',
            '**产物**：Windows 单文件启动器（`-win-x86.exe`）、Windows 完整包（`-win-x86.zip`）、Linux / Steam Proton 包（`-linux-proton.tar.gz`，解压到游戏根目录后用 `ra3copilot.sh inject` 注入）。',
            '',
            '**使用**：进入对局 → 双击 `Ra3Copilot.exe`（单文件版文件名带版本号，内容相同）→ 「注入」→ 游戏内按呼出键（默认 `F12`）呼出面板。功能按资源 / 战斗 / 建造 / 单位 / 召唤 / 协议 / 战场感知分组。呼出键、全部功能热键、J 键预设增援的单位与数量，都在启动器「设置」里改，改完 1 秒内生效、不用重注入。注入即常驻监听 `127.0.0.1:17832`。',
            '',
            '**CI 只验证可构建**：字节级兼容性以本地 `tools/precheck_aob.py` 对真实 exe 的预检为准（当前基线 30 个站点全部通过，5 个单构建专用站点按设计跳过）。',
            '',
            '仅用于单机学习与研究。'
          ) -join "`n" | Set-Content RELEASE_NOTES.md -Encoding utf8
          Get-Content RELEASE_NOTES.md | Select-Object -First 12

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: |
            Ra3Copilot-${{ github.ref_name }}-win-x86.zip
            Ra3Copilot-${{ github.ref_name }}-win-x86.exe
            ra3-copilot/injector.exe
            ra3-copilot/ra3diag.exe
            RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-artifacts
          path: |
            ra3-copilot/build_out/*.map
            ra3-copilot/build_log.txt
          if-no-files-found: ignore

  build-linux:
    name: Build Proton/Linux bundle
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Proton 里跑的仍是 32 位 PE，DLL 用 llvm-mingw 交叉编译；注入器复用 Windows 构建的 x86 版。
      - name: Install llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          VER=20261020
          ASSET="llvm-mingw-${VER}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL -o "$ASSET" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${VER}/${ASSET}"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf "$ASSET" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          "$RUNNER_TEMP/llvm-mingw/bin/i686-w64-mingw32-clang++" --version | head -1

      - name: Build ra3copilot.dll (i686 PE)
        working-directory: ra3-copilot
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$RUNNER_TEMP/llvm-mingw" OUT=build_linux bash tools/build_linux.sh
          test -s build_linux/ra3copilot.dll
          ls -l build_linux/ra3copilot.dll

      - name: Download Windows injector
        uses: actions/download-artifact@v4
        with:
          name: win-dist
          path: win-dist

      - name: Package Proton bundle
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          STAGE=stage-linux
          mkdir -p "$STAGE/Ra3Copilot-win"
          cp ra3-copilot/build_linux/ra3copilot.dll "$STAGE/Ra3Copilot-win/"
          INJ="$(find win-dist -type f -name injector.exe -print -quit)"
          test -n "$INJ"
          cp "$INJ" "$STAGE/Ra3Copilot-win/"
          DIAG="$(find win-dist -type f -name ra3diag.exe -print -quit)"
          test -n "$DIAG"
          cp "$DIAG" "$STAGE/Ra3Copilot-win/"
          cp ra3-copilot/tools/linux/ra3copilot.sh "$STAGE/"
          chmod +x "$STAGE/ra3copilot.sh"
          printf '%s\n' \
            'Ra3-Copilot — Linux / Steam Proton' \
            '' \
            '把本包解压到游戏根目录（含 Data/ 的 Red Alert 3 文件夹），得到 Ra3Copilot-win/ 与 ra3copilot.sh。' \
            '' \
            '  ./ra3copilot.sh inject     注入（先启动游戏并进入对局）' \
            '  ./ra3copilot.sh unload     卸载' \
            '  ./ra3copilot.sh status     只看游戏进程' \
            '  ./ra3copilot.sh ping       查 127.0.0.1:17832 接口' \
            '' \
            'Steam 启动项可写成：  "/path/to/Red Alert 3/ra3copilot.sh" launch %command%' \
            '脚本等游戏进程出现后自动注入，日志在 Ra3Copilot-win/inject-launch.log。' \
            '' \
            'Ra3Copilot-win/ra3copilot.dll 由 llvm-mingw 交叉编译，配合同目录的 injector.exe' \
            '在游戏所在的 Proton 前缀里注入；不要换成 Windows 版 DLL。' \
            '中文面板字体取 Proton 前缀内的 msyh.ttf / simsun.ttc，找不到时可在 DLL 同目录' \
            '放一份 ra3copilot_font.ttf。' \
            '' \
            '排查开关：DLL 同目录 ra3copilot_debug.ini（详见仓库 README「Linux / Steam Proton」）。' \
            '' \
            '仅用于单机学习与研究。' \
            > "$STAGE/LINUX.txt"
          tar -czf "Ra3Copilot-${REF}-linux-proton.tar.gz" -C "$STAGE" .
          ls -lh "Ra3Copilot-${REF}-linux-proton.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: Ra3Copilot-${{ github.ref_name }}-linux-proton.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          merge-multiple: true
          path: dist

      - name: Build checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            "Ra3Copilot-${{ github.ref_name }}-win-x86.zip" \
            "Ra3Copilot-${{ github.ref_name }}-win-x86.exe" \
            "Ra3Copilot-${{ github.ref_name }}-linux-proton.tar.gz" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ra3-Copilot ${{ github.ref_name }}
          files: |
            dist/Ra3Copilot-${{ github.ref_name }}-win-x86.zip
            dist/Ra3Copilot-${{ github.ref_name }}-win-x86.exe
            dist/Ra3Copilot-${{ github.ref_name }}-linux-proton.tar.gz
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          # 同一个 tag 重新推送时覆盖已有 Release（产物与说明一起替换）
          allowUpdates: true

      # 重发同名 tag 时，旧命名的资产不会被 action 覆盖，会一直挂在 Release 上。
      # 按本次命名规则保留，其余删掉，免得同一版挂着多份产物。
      - name: Prune stale assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          keep=$(printf '%s\n' \
            "Ra3Copilot-$tag-win-x86.zip" \
            "Ra3Copilot-$tag-win-x86.exe" \
            "Ra3Copilot-$tag-linux-proton.tar.gz" \
            "SHA256SUMS.txt")
          gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | [.name, .id] | @tsv' |
          while IFS=$'\t' read -r name id; do
            if ! grep -qxF "$name" <<< "$keep"; then
              echo "删除旧资产: $name"
              gh api -X DELETE "repos/$repo/releases/assets/$id"
            fi
          done
